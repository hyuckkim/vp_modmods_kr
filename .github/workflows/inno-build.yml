name: VPKR
on: push
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: iscc "vp_modmods_kr installer file/VPKR.iss" /O"out_githubaction" /F"VPKR"
      - uses: actions/upload-artifact@v4
        with:
          name: "VPKR"
          path: "out_githubaction/VPKR.exe"
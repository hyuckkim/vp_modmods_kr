name: VP INT+
on: push
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: iscc "vp_modmods_kr installer file/CPPSetupData.iss" /O"out_githubaction" /F"vp_kr+"
      - uses: actions/upload-artifact@v4
        with:
          name: "Vox Populi INT+"
          path: "out_githubaction/vp_kr+.exe"

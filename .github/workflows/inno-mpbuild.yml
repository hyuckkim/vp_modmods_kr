name: VP INT MP+
on: push
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: iscc "vp_modmods_kr mpinstaller file/VPINTModpack.iss" /O"out_githubaction" /F"vp_kr+Modpack"
      - uses: actions/upload-artifact@v4
        with:
          name: "VP INT Modpack+"
          path: "out_githubaction/vp_kr+Modpack.exe"

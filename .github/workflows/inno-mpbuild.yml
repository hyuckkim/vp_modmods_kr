name: VP 한국어 모드팩
on: push
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: iscc "vp_modmods_kr mpinstaller file/VPKRMP.iss" /O"out_githubaction" /F"VP 한국어 모드팩"
      - uses: actions/upload-artifact@v4
        with:
          name: "VP 한국어 모드팩"
          path: "out_githubaction/VP 한국어 모드팩.exe"